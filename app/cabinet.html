<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кабинет</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #160d33;
      --card: #2a1b55;
      --ink: #ffffff;
      --muted: #b7a6d6;
      --accent: #7b4dff;
      --icon: #3a2774;
      --danger: #e23b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main {
      max-width: 440px;
      margin: 0 auto;
      padding: 22px 16px 64px;
    }
    .hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .mascot { width: 96px; height: 96px; flex: none; object-fit: contain; }
    p.lead { margin: 8px 0 0; color: var(--muted); line-height: 1.4; }
    input, button { font: inherit; color: inherit; }
    .search {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }
    .search input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: #241447;
      border-radius: 14px;
      padding: 12px 14px;
    }
    .search input::placeholder { color: #8d7aaf; }
    button {
      border: 0;
      background: var(--accent);
      color: white;
      border-radius: 14px;
      padding: 12px 16px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    section { margin-top: 26px; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    h2 { font-size: 22px; margin: 0; }
    #results-title { margin-bottom: 12px; }
    button.link {
      background: transparent;
      color: var(--muted);
      padding: 0;
      font-size: 16px;
    }
    .swipe {
      position: relative;
      margin-bottom: 10px;
      border-radius: 18px;
      overflow: hidden;
    }
    .trash {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      width: 72px;
      border-radius: 0;
      background: var(--danger);
      display: grid;
      place-items: center;
    }
    .face {
      position: relative;
      background: var(--card);
      border-radius: 18px;
      transition: transform 0.18s ease;
      touch-action: pan-y;
    }
    .swipe.open-swipe .face { transform: translateX(-72px); }
    .card {
      display: grid;
      grid-template-columns: 44px 1fr 16px;
      gap: 12px;
      align-items: center;
      padding: 14px;
    }
    .icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--icon);
      display: grid;
      place-items: center;
      color: #d7c8ff;
    }
    .glyph { font-size: 22px; line-height: 1; }
    .card h3 { margin: 0 0 2px; font-size: 16px; font-weight: 650; }
    .meta { color: var(--muted); font-size: 13px; }
    .snippet {
      margin-top: 8px;
      line-height: 1.45;
      white-space: pre-wrap;
      color: #efe8ff;
    }
    .chev { color: var(--muted); font-size: 22px; line-height: 1; }
    mark {
      background: transparent;
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .badge { display: inline-block; margin-top: 8px; font-size: 12px; color: #c4b0ff; }
    .empty, #quiz-status { color: var(--muted); }
    .error { color: #ffb4b4; }
    #quiz-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    #quiz-actions input {
      flex: 1;
      min-width: 140px;
      border: 0;
      background: #241447;
      border-radius: 14px;
      padding: 12px 14px;
    }
    #quiz-play { margin-top: 14px; }
    #quiz-play h3 { margin: 0 0 6px; }
    #quiz-play .options button {
      display: block;
      width: 100%;
      margin-top: 8px;
      text-align: left;
      background: var(--card);
      color: var(--ink);
    }
    .feedback { margin: 0 0 10px; line-height: 1.45; }
    .feedback.ok { color: #b7f0c8; }
    .feedback.bad { color: #ffb4b4; }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <div>
        <h1>Кабинет</h1>
        <p id="who" class="lead" hidden></p>
      </div>
      <img class="mascot" src="/assets/lumi-mark.png" alt="">
    </header>
    <p id="gate" class="lead">Откройте кабинет кнопкой в чате MAX.</p>
    <div id="cabinet" hidden>
      <form id="search-form" class="search">
        <input id="query" type="search" placeholder="Слово или фраза" autocomplete="off">
        <button type="submit">Найти</button>
      </form>
      <section>
        <h2 id="results-title" hidden>Результаты поиска</h2>
        <div id="results"></div>
      </section>
      <section>
        <div class="section-head">
          <h2>Конспекты</h2>
          <button type="button" class="link" id="show-all" hidden>Все &gt;</button>
        </div>
        <div id="notes"></div>
      </section>
      <section>
        <h2>Квиз</h2>
        <div id="quiz-actions">
          <button type="button" id="quiz-errors">По ошибкам</button>
          <input id="quiz-topic" type="text" placeholder="Тема, например: дроби" autocomplete="off">
          <button type="button" id="quiz-by-topic">По теме</button>
        </div>
        <p id="quiz-status" class="empty"></p>
        <div id="quiz-play" hidden></div>
      </section>
    </div>
  </main>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <script>
    const LOCKED = "Откройте кабинет кнопкой в чате MAX.";
    const notesBox = document.querySelector("#notes");
    const resultsBox = document.querySelector("#results");
    const resultsTitle = document.querySelector("#results-title");
    const queryInput = document.querySelector("#query");
    const gate = document.querySelector("#gate");
    const cabinet = document.querySelector("#cabinet");
    const who = document.querySelector("#who");
    const showAll = document.querySelector("#show-all");
    const quizStatus = document.querySelector("#quiz-status");
    const quizPlay = document.querySelector("#quiz-play");
    const quizTopic = document.querySelector("#quiz-topic");
    const quizActions = document.querySelector("#quiz-actions");
    const previews = new Map();
    const opened = new Map();
    let allNotes = [];
    let notesExpanded = false;
    let swipeMoved = false;

    const ICONS = {
      pi: '<span class="glyph">π</span>',
      globe: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c2.5 2.8 2.5 13.2 0 16M12 4c-2.5 2.8-2.5 13.2 0 16"/></svg>',
      book: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v16H7.5A2.5 2.5 0 0 0 5 21.5z"/><path d="M5 5.5A2.5 2.5 0 0 1 7.5 8H19"/></svg>'
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>]/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;"
      })[char]);
    }

    function polish(html) {
      return html
        .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
        .replace(/`([^`\n]+)`/g, "$1");
    }

    function highlight(value, query) {
      let html = escapeHtml(value);
      const words = String(query || "").trim().split(/\s+/).filter(Boolean);
      words.forEach((word) => {
        const pattern = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
        html = html.replace(pattern, (match) => "<mark>" + match + "</mark>");
      });
      return polish(html);
    }

    function subjectKind(subject) {
      const text = String(subject || "").toLowerCase();
      if (/алгебр|матем|геометр|уравнен/.test(text)) return "pi";
      if (/обществ|истори|географ/.test(text)) return "globe";
      return "book";
    }

    function showGate(text) {
      cabinet.hidden = true;
      who.hidden = true;
      gate.hidden = false;
      gate.textContent = text;
    }

    function showCabinet() {
      gate.hidden = true;
      cabinet.hidden = false;
    }

    function renderProfile(profile) {
      const parts = [];
      const name = String(profile.first_name || "").trim();
      if (name) parts.push(name);
      if (profile.grade != null) parts.push(profile.grade + " класс");
      const style = { short: "короче", detail: "подробнее" }[profile.explain_style];
      if (style) parts.push(style);
      who.textContent = parts.join(" · ") + " >";
      who.hidden = parts.length === 0;
    }

    function noteCard(note) {
      const id = String(note.id);
      previews.set(id, note.preview || "");
      const open = opened.has(id);
      const snippet = open ? highlight(opened.get(id) || "", queryInput.value) : "";
      return `
        <div class="swipe" data-id="${escapeHtml(note.id)}">
          <button type="button" class="trash" aria-label="Удалить">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M4 7h16M9 7V5h6v2M8 7l1 13h6l1-13"/></svg>
          </button>
          <article class="face card note">
            <div class="icon">${ICONS[subjectKind(note.subject)]}</div>
            <div>
              <h3>${polish(escapeHtml(note.title))}</h3>
              <div class="meta">${escapeHtml(note.subject || "без предмета")}</div>
              <div class="snippet"${open ? "" : " hidden"}>${snippet}</div>
            </div>
            <span class="chev">›</span>
          </article>
        </div>
      `;
    }

    function renderNotes(notes) {
      allNotes = notes;
      notesExpanded = false;
      previews.clear();
      opened.clear();
      paintNotes();
    }

    function paintNotes() {
      if (!allNotes.length) {
        showAll.hidden = true;
        notesBox.innerHTML = '<p class="empty">Конспекты появятся, когда в чате нажмёте «В конспект».</p>';
        return;
      }
      const visible = notesExpanded ? allNotes : allNotes.slice(0, 3);
      showAll.hidden = allNotes.length <= 3 || notesExpanded;
      notesBox.innerHTML = visible.map(noteCard).join("");
      bindSwipe();
    }

    function renderResults(hits, query) {
      const active = Boolean(query.trim());
      resultsTitle.hidden = !active;
      if (!active) {
        resultsBox.innerHTML = "";
        return;
      }
      if (!hits.length) {
        resultsBox.innerHTML = '<p class="empty">Ничего не нашлось.</p>';
        return;
      }
      resultsBox.innerHTML = hits.map((hit) => `
        <article class="card">
          <div class="icon">${ICONS[subjectKind(hit.subject)]}</div>
          <div>
            <h3>${highlight(hit.title, query)}</h3>
            <div class="meta">${escapeHtml(hit.subject || "без предмета")}</div>
            <div class="snippet">${highlight(hit.snippet, query)}</div>
            ${hit.semantic ? '<div class="badge">Совпадение по смыслу</div>' : ""}
          </div>
          <span class="chev">›</span>
        </article>
      `).join("");
    }

    async function loadCabinet() {
      const profileResponse = await fetch("/api/profile");
      if (profileResponse.status === 401) {
        showGate(LOCKED);
        return;
      }
      if (!profileResponse.ok) {
        showGate("Кабинет не смог открыть базу.");
        return;
      }
      renderProfile(await profileResponse.json());
      const notesResponse = await fetch("/api/notes");
      if (notesResponse.status === 401) {
        showGate(LOCKED);
        return;
      }
      if (!notesResponse.ok) {
        showGate("Кабинет не смог открыть базу.");
        return;
      }
      const notesPayload = await notesResponse.json();
      renderNotes(notesPayload.notes || []);
      showCabinet();
    }

    document.querySelector("#search-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const query = queryInput.value;
      if (!query.trim()) {
        renderResults([], query);
        return;
      }
      const response = await fetch("/api/search?q=" + encodeURIComponent(query));
      if (response.status === 401) {
        showGate(LOCKED);
        return;
      }
      if (!response.ok) {
        resultsTitle.hidden = false;
        resultsBox.innerHTML = '<p class="error">Поиск не ответил.</p>';
        return;
      }
      renderResults(await response.json(), query);
      renderNotesFromCache();
    });

    function renderNotesFromCache() {
      notesBox.querySelectorAll(".swipe").forEach((row) => {
        const id = row.dataset.id;
        const snippet = row.querySelector(".snippet");
        const open = opened.has(id);
        snippet.hidden = !open;
        snippet.innerHTML = highlight(open ? opened.get(id) || "" : "", queryInput.value);
      });
    }

    async function deleteNote(row) {
      const id = row.dataset.id;
      const response = await fetch("/api/notes/" + encodeURIComponent(id), { method: "DELETE" });
      if (response.status === 401) {
        showGate(LOCKED);
        return;
      }
      if (!response.ok) return;
      previews.delete(id);
      opened.delete(id);
      allNotes = allNotes.filter((note) => String(note.id) !== id);
      paintNotes();
    }

    function bindSwipe() {
      notesBox.querySelectorAll(".swipe").forEach((row) => {
        const face = row.querySelector(".face");
        let startX = 0;
        let startY = 0;
        let base = 0;
        let dragging = false;
        let axis = "";
        face.addEventListener("pointerdown", (event) => {
          if (event.target.closest("button")) return;
          dragging = true;
          axis = "";
          startX = event.clientX;
          startY = event.clientY;
          base = row.classList.contains("open-swipe") ? -72 : 0;
          face.setPointerCapture(event.pointerId);
        });
        face.addEventListener("pointermove", (event) => {
          if (!dragging) return;
          const mx = event.clientX - startX;
          const my = event.clientY - startY;
          if (!axis && Math.hypot(mx, my) > 6) axis = Math.abs(mx) > Math.abs(my) ? "x" : "y";
          if (axis !== "x") return;
          const next = Math.min(0, Math.max(-84, base + mx));
          face.style.transform = "translateX(" + next + "px)";
        });
        face.addEventListener("pointerup", (event) => {
          if (!dragging) return;
          dragging = false;
          const mx = event.clientX - startX;
          face.style.transform = "";
          if (axis === "x") {
            swipeMoved = true;
            row.classList.toggle("open-swipe", base + mx < -40);
          }
          axis = "";
        });
        face.addEventListener("pointercancel", () => {
          dragging = false;
          face.style.transform = "";
        });
      });
    }

    notesBox.addEventListener("click", async (event) => {
      const row = event.target.closest(".swipe");
      if (!row) return;
      if (event.target.closest(".trash")) {
        await deleteNote(row);
        return;
      }
      if (swipeMoved) {
        swipeMoved = false;
        return;
      }
      if (row.classList.contains("open-swipe")) {
        row.classList.remove("open-swipe");
        return;
      }
      const id = row.dataset.id;
      const snippet = row.querySelector(".snippet");
      if (opened.has(id)) {
        opened.delete(id);
        snippet.hidden = true;
        snippet.innerHTML = "";
        return;
      }
      const response = await fetch("/api/notes/" + encodeURIComponent(id));
      if (response.status === 401) {
        showGate(LOCKED);
        return;
      }
      if (!response.ok) return;
      const note = await response.json();
      opened.set(id, note.body || "");
      snippet.hidden = false;
      snippet.innerHTML = highlight(note.body || "", queryInput.value);
    });

    showAll.addEventListener("click", () => {
      notesExpanded = true;
      paintNotes();
    });

    function setQuizBusy(busy) {
      quizActions.querySelectorAll("button, input").forEach((control) => {
        control.disabled = busy;
      });
    }

    function renderQuiz(data) {
      const feedback = data.feedback;
      const question = data.question;
      if (data.finished || !question) {
        const note = feedback
          ? (feedback.correct ? "Верно. " : "Пока неверно. ") + (feedback.explanation || "")
          : "";
        quizPlay.hidden = false;
        quizPlay.innerHTML = `
          <h3>${escapeHtml(data.title || "Квиз")}</h3>
          <p class="feedback ${feedback && feedback.correct ? "ok" : "bad"}">${escapeHtml(note)}</p>
          <p>Квиз пройден. Закрыто ${escapeHtml(data.done)} из ${escapeHtml(data.total)}.</p>
        `;
        return;
      }
      const note = feedback
        ? `<p class="feedback ${feedback.correct ? "ok" : "bad"}">${escapeHtml(
            (feedback.correct ? "Верно. " : "Пока неверно. ") + (feedback.explanation || "")
          )}</p>`
        : "";
      const options = (question.options || []).map((option, index) => `
        <button type="button" data-option="${index}">${escapeHtml(option)}</button>
      `).join("");
      quizPlay.hidden = false;
      quizPlay.innerHTML = `
        <h3>${escapeHtml(data.title || "Квиз")}</h3>
        <p class="meta">Закрыто ${escapeHtml(data.done)} из ${escapeHtml(data.total)}</p>
        ${note}
        <p>${escapeHtml(question.prompt || "")}</p>
        <div class="options" data-question="${escapeHtml(question.id)}">${options}</div>
      `;
    }

    async function startQuiz(url, body) {
      setQuizBusy(true);
      quizStatus.textContent = "Собираю квиз";
      quizPlay.hidden = true;
      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body || {})
        });
        if (response.status === 401) {
          showGate(LOCKED);
          return;
        }
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          quizStatus.textContent = typeof data.detail === "string" ? data.detail : "Квиз не собрался.";
          return;
        }
        quizStatus.textContent = "";
        renderQuiz(data);
      } finally {
        setQuizBusy(false);
      }
    }

    document.querySelector("#quiz-errors").addEventListener("click", () => {
      startQuiz("/api/quizzes/errors");
    });

    document.querySelector("#quiz-by-topic").addEventListener("click", () => {
      startQuiz("/api/quizzes/topic", { topic: quizTopic.value });
    });

    quizPlay.addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-option]");
      if (!button) return;
      const questionId = Number(button.parentElement.dataset.question);
      const option = Number(button.dataset.option);
      setQuizBusy(true);
      quizPlay.querySelectorAll("button").forEach((item) => {
        item.disabled = true;
      });
      try {
        const response = await fetch("/api/quizzes/answer", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question_id: questionId, option })
        });
        if (response.status === 401) {
          showGate(LOCKED);
          return;
        }
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          quizStatus.textContent = typeof data.detail === "string" ? data.detail : "Ответ не принят.";
          quizPlay.querySelectorAll("button").forEach((item) => {
            item.disabled = false;
          });
          return;
        }
        quizStatus.textContent = "";
        renderQuiz(data);
      } finally {
        setQuizBusy(false);
      }
    });

    async function enter() {
      const webApp = window.WebApp;
      const initData = webApp && typeof webApp.initData === "string" ? webApp.initData : "";
      if (webApp && typeof webApp.ready === "function") webApp.ready();
      if (initData) {
        const response = await fetch("/api/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ init_data: initData })
        });
        if (response.status === 401) {
          showGate("Не удалось подтвердить вход. Закройте кабинет и откройте его кнопкой в чате.");
          return;
        }
        if (!response.ok) {
          showGate("Кабинет не смог открыть базу.");
          return;
        }
      }
      await loadCabinet();
    }

    enter().catch(() => showGate("Кабинет не смог открыть базу."));
  </script>
</body>
</html>
