<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кабинет</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4efe4;
      --card: #fffdf8;
      --ink: #1d1a16;
      --muted: #6d6458;
      --line: #e2d8c8;
      --green: #1f4b3a;
      --mark: #ffe08a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    main {
      max-width: 440px;
      margin: 0 auto;
      padding: 28px 18px 64px;
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-size: 36px;
      margin: 0 0 8px;
    }
    p.lead { margin: 0; color: var(--muted); line-height: 1.45; }
    label { display: block; font-size: 14px; margin-bottom: 6px; color: var(--muted); }
    input, button { font: inherit; color: inherit; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      background: white;
      border-radius: 10px;
      padding: 12px 14px;
    }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; min-width: 0; }
    button {
      border: 0;
      background: var(--green);
      color: white;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
    }
    button.delete {
      margin-top: 12px;
      background: transparent;
      color: var(--green);
      border: 1px solid var(--line);
      padding: 8px 12px;
    }
    section { margin-top: 28px; }
    h2 { font-size: 20px; margin: 0 0 12px; }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    article.note { cursor: pointer; }
    article h3 { margin: 0 0 4px; font-size: 18px; }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .snippet { line-height: 1.5; white-space: pre-wrap; }
    mark {
      background: var(--mark);
      color: inherit;
      padding: 0 0.15em;
      border-radius: 0.2em;
    }
    .badge {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      color: var(--green);
    }
    .empty { color: var(--muted); }
    .error { color: #8d2d2d; }
    #who { margin: 0 0 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Кабинет</h1>
    <p id="who" class="lead" hidden></p>
    <p id="gate" class="lead">Откройте кабинет кнопкой в чате MAX.</p>
    <div id="cabinet" hidden>
      <section>
        <h2>Поиск</h2>
        <form id="search-form" class="row">
          <input id="query" type="search" placeholder="Слово или фраза" autocomplete="off">
          <button type="submit">Найти</button>
        </form>
        <div id="results"></div>
      </section>
      <section>
        <h2>Конспекты</h2>
        <div id="notes"></div>
      </section>
      <section>
        <h2>Ошибки</h2>
        <div id="errors"></div>
      </section>
    </div>
  </main>
  <script src="https://st.max.ru/js/max-web-app.js"></script>
  <script>
    const LOCKED = "Откройте кабинет кнопкой в чате MAX.";
    const notesBox = document.querySelector("#notes");
    const errorsBox = document.querySelector("#errors");
    const resultsBox = document.querySelector("#results");
    const queryInput = document.querySelector("#query");
    const gate = document.querySelector("#gate");
    const cabinet = document.querySelector("#cabinet");
    const who = document.querySelector("#who");
    const previews = new Map();
    const opened = new Map();

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>]/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;"
      })[char]);
    }

    function polish(html) {
      return html
        .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
        .replace(/`([^`\n]+)`/g, "$1");
    }

    function highlight(value, query) {
      let html = escapeHtml(value);
      const words = String(query || "").trim().split(/\s+/).filter(Boolean);
      words.forEach((word) => {
        const pattern = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
        html = html.replace(pattern, (match) => "<mark>" + match + "</mark>");
      });
      return polish(html);
    }

    function showGate(text) {
      cabinet.hidden = true;
      who.hidden = true;
      gate.hidden = false;
      gate.textContent = text;
    }

    function showCabinet() {
      gate.hidden = true;
      cabinet.hidden = false;
    }

    function renderProfile(profile) {
      const parts = [];
      const name = String(profile.first_name || "").trim();
      if (name) parts.push(name);
      if (profile.grade != null) parts.push(profile.grade + " класс");
      const style = { short: "короче", detail: "подробнее" }[profile.explain_style];
      if (style) parts.push(style);
      who.textContent = parts.join(" · ");
      who.hidden = parts.length === 0;
    }

    function renderNotes(notes) {
      previews.clear();
      opened.clear();
      if (!notes.length) {
        notesBox.innerHTML = '<p class="empty">Конспекты появятся, когда в чате нажмёте «В конспект».</p>';
        return;
      }
      notesBox.innerHTML = notes.map((note) => {
        previews.set(String(note.id), note.preview || "");
        return `
          <article class="note" data-id="${escapeHtml(note.id)}">
            <h3>${polish(escapeHtml(note.title))}</h3>
            <div class="meta">${escapeHtml(note.subject || "без предмета")}</div>
            <div class="snippet">${highlight(note.preview || "", queryInput.value)}</div>
          </article>
        `;
      }).join("");
    }

    function renderErrors(errors) {
      if (!errors.length) {
        errorsBox.innerHTML = '<p class="empty">Ошибки появятся после проверки решения с ошибкой.</p>';
        return;
      }
      errorsBox.innerHTML = errors.map((item) => `
        <article>
          <h3>${escapeHtml(item.mistake)}</h3>
          <div class="meta">${escapeHtml(item.subject || "предмет не указан")}</div>
          <div class="snippet">${escapeHtml(item.problem || "")}</div>
        </article>
      `).join("");
    }

    function renderResults(hits, query) {
      if (!query.trim()) {
        resultsBox.innerHTML = "";
        return;
      }
      if (!hits.length) {
        resultsBox.innerHTML = '<p class="empty">Ничего не нашлось.</p>';
        return;
      }
      resultsBox.innerHTML = hits.map((hit) => `
        <article>
          <h3>${highlight(hit.title, query)}</h3>
          <div class="meta">${escapeHtml(hit.subject || "без предмета")}</div>
          <div class="snippet">${highlight(hit.snippet, query)}</div>
          ${hit.semantic ? '<div class="badge">Совпадение по смыслу</div>' : ""}
        </article>
      `).join("");
    }

    async function loadCabinet() {
      const profileResponse = await fetch("/api/profile");
      if (profileResponse.status === 401) {
        showGate(LOCKED);
        return;
      }
      if (!profileResponse.ok) {
        showGate("Кабинет не смог открыть базу.");
        return;
      }
      renderProfile(await profileResponse.json());
      const [notesResponse, errorsResponse] = await Promise.all([
        fetch("/api/notes"),
        fetch("/api/errors")
      ]);
      if (notesResponse.status === 401 || errorsResponse.status === 401) {
        showGate(LOCKED);
        return;
      }
      if (!notesResponse.ok || !errorsResponse.ok) {
        showGate("Кабинет не смог открыть базу.");
        return;
      }
      const notesPayload = await notesResponse.json();
      renderNotes(notesPayload.notes || []);
      renderErrors(await errorsResponse.json());
      showCabinet();
    }

    document.querySelector("#search-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const query = queryInput.value;
      if (!query.trim()) {
        renderResults([], query);
        return;
      }
      const response = await fetch("/api/search?q=" + encodeURIComponent(query));
      if (response.status === 401) {
        showGate(LOCKED);
        return;
      }
      if (!response.ok) {
        resultsBox.innerHTML = '<p class="error">Поиск не ответил.</p>';
        return;
      }
      renderResults(await response.json(), query);
      renderNotesFromCache();
    });

    function renderNotesFromCache() {
      notesBox.querySelectorAll("article.note").forEach((article) => {
        const id = article.dataset.id;
        const snippet = article.querySelector(".snippet");
        const text = opened.get(id) || previews.get(id) || "";
        snippet.innerHTML = highlight(text, queryInput.value);
      });
    }

    function showDelete(article) {
      if (article.querySelector("button.delete")) return;
      const button = document.createElement("button");
      button.type = "button";
      button.className = "delete";
      button.textContent = "Удалить";
      article.append(button);
    }

    async function deleteNote(article) {
      const id = article.dataset.id;
      const response = await fetch("/api/notes/" + encodeURIComponent(id), { method: "DELETE" });
      if (response.status === 401) {
        showGate(LOCKED);
        return;
      }
      if (!response.ok) return;
      previews.delete(id);
      opened.delete(id);
      article.remove();
      if (!notesBox.querySelector("article.note")) {
        notesBox.innerHTML = '<p class="empty">Конспекты появятся, когда в чате нажмёте «В конспект».</p>';
      }
    }

    notesBox.addEventListener("click", async (event) => {
      const article = event.target.closest("article.note");
      if (!article) return;
      if (event.target.closest("button.delete")) {
        await deleteNote(article);
        return;
      }
      const id = article.dataset.id;
      const snippet = article.querySelector(".snippet");
      if (opened.has(id)) {
        opened.delete(id);
        article.querySelector("button.delete")?.remove();
        snippet.innerHTML = highlight(previews.get(id) || "", queryInput.value);
        return;
      }
      const response = await fetch("/api/notes/" + encodeURIComponent(id));
      if (response.status === 401) {
        showGate(LOCKED);
        return;
      }
      if (!response.ok) return;
      const note = await response.json();
      opened.set(id, note.body || "");
      snippet.innerHTML = highlight(note.body || "", queryInput.value);
      showDelete(article);
    });

    async function enter() {
      const webApp = window.WebApp;
      const initData = webApp && typeof webApp.initData === "string" ? webApp.initData : "";
      if (webApp && typeof webApp.ready === "function") webApp.ready();
      if (initData) {
        const response = await fetch("/api/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ init_data: initData })
        });
        if (response.status === 401) {
          showGate("Не удалось подтвердить вход. Закройте кабинет и откройте его кнопкой в чате.");
          return;
        }
        if (!response.ok) {
          showGate("Кабинет не смог открыть базу.");
          return;
        }
      }
      await loadCabinet();
    }

    enter().catch(() => showGate("Кабинет не смог открыть базу."));
  </script>
</body>
</html>
