services:
  tutor:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      WEB_HOST: 0.0.0.0
      DATABASE_PATH: /app/data/tutor.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
